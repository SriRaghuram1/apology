<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I am sorry Chotu</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffeef2, #ffd6e0);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 40px 25px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(255, 75, 110, 0.15);
      max-width: 340px;
      width: 100%;
    }
    .emoji {
      font-size: 65px;
      margin-bottom: 12px;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      color: #e63946;
      font-size: 24px;
      margin: 10px 0;
      font-weight: 700;
    }
    p {
      color: #555555;
      font-size: 15px;
      line-height: 1.5;
      margin: 10px 0 25px 0;
    }
    button {
      padding: 12px 28px;
      background: #e63946;
      color: #ffffff;
      border: none;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(230, 57, 70, 0.35);
      transition: transform 0.2s;
    }
    button:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🥺👉👈</div>
    <h1>I am sorry Chotu</h1>
    <p>I really didn't mean to upset you.<br>Please forgive me?</p>
    <button onclick="alert('❤️ Apology Accepted! You are the best.')">Forgive Me ❤️</button>
  </div>
</body>
</html>
